services:
  db:
    image: postgres:16
    container_name: isho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - isho-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The spec suite truncates every table before each example. On the volume above
  # that costs about half a second per example (file recreation plus fsync), which
  # was half of the whole run. Here the data directory lives in tmpfs, so the
  # suite gets its own fast database and nothing is kept between restarts.
  # script/spec.ps1 starts this service and points the specs at port 5433.
  db-test:
    image: postgres:16
    container_name: isho-postgres-test
    restart: unless-stopped
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  isho-db:
